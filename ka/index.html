<script>
  /* Before first paint.
     Theme: always dark, whatever the system asks (7 Oct, his call: "keep the dark theme the default and hide the mode
     switch"). The day theme is kept for later, reachable only by "#light" in the address; there is no visible switch.
     Language: each page is one language (/ English, /ka/ Georgian). Old links with "?lang=ka" go to /ka/ and
     "?lang=en" to /; any other query and the hash ride along. The old "last choice" key is cleared.
     Motion gate (MOTION.md, pattern 0): only when JS runs and motion is allowed are the entrance blocks hidden, and a
     failsafe shows them after 1.2 s whatever happens. Once the failsafe has shown them, the entrance never runs: the
     page script checks the gate is still up before it animates anything. The 1200 ms is --gate-failsafe (this runs
     before the stylesheet exists, so it keeps its own copy; build_dist.py checks the two match). */
  (function () {
    var d = document.documentElement; d.classList.add('js');
    function theme() { if (location.hash === '#light') d.setAttribute('data-theme', 'light'); else d.removeAttribute('data-theme'); }
    theme(); window.addEventListener('hashchange', theme);
    var m = /[?&]lang=(ka|en)\b/.exec(location.search);
    if (m) {
      var to = m[1] === 'ka' ? '/ka/' : '/', q = location.search.replace(/([?&])lang=(ka|en)\b&?/, '$1').replace(/[?&]$/, '');
      if (location.pathname !== to) { location.replace(to + q + location.hash); return; }
      try { history.replaceState(null, '', to + q + location.hash); } catch (e) {}
    }
    try { localStorage.removeItem('lang'); } catch (e) {}
    try { if (!matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('m-pre'); } catch (e) {}
    setTimeout(function () { d.classList.remove('m-pre'); }, 1200);
  })();
</script>

<!-- Switzer (Fontshare, ITF Free Font License v2.0: free for commercial use, self-hosting allowed, redistribution
     banned, so it is loaded from Fontshare's CSS API and never committed to this public repo). Chosen by Demetre on 7 Oct
     2026 from research/fonts-board.html. Noto Sans Georgian (OFL) carries the Georgian. -->
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300..500&display=swap">
<style>
  /* Design read: a keynote slide at night. One lit portrait on a dark stage, the name set large and light under it,
     one grey line, and under that one quiet row of monochrome marks for the profiles and email. Everything sits on
     one centre axis; the rest is black.
     The light is the photograph's own: each print's backdrop is repainted so its edges meet the page at the page's
     own tone (n4-keynote/photo/prints.py), so the print has no visible frame and the soft pool of light around his
     head, which is the seamless's photographed falloff, is the only glow on the page.
     Type: Switzer, light (300) at size; Noto Sans Georgian carries the Georgian.
     Theme: dark always, whatever the system asks (7 Oct). The day palette is kept for later; only "#light" in the
     address turns it on, and nothing on the page links there.
     The design system: DESIGN.md (rules) and docs/design-system.html (the living style guide, written by
     build_dist.py from this file). */

  /* ==== TOKENS ======================================================================================================
     Every colour, size, space, radius, duration and layer on the page is a token here; the rules further down only
     read tokens (no raw numbers but 0, 100%, auto and the like). Tokens change in five places only, all in this
     block: the base, Georgian, the 600 px and 1000 px breakpoints, and the kept day theme. A component's layout may
     switch at a breakpoint (the email card goes to one line from 600 px, Also to one line from 1000 px), but every
     size it uses there is still a token; a component never tests the language.
     Format (build_dist.py parses it for the style guide): one token per line, "--name: value;", an optional
     comment after it on the same line. */
  :root {
    /* Colour roles. Contrast ratios are against --bg. */
    --bg: #131416;                 /* the stage; = the dark print's edge tone, so the print melts into it */
    --surface: #1B1C1F;            /* a raised card (EmailCard, Tooltip): one step off the stage */
    --ink: #F2F2F4;                /* 16.5:1. The name, and whatever is under the pointer, focused or open */
    --ink-2: #BFC1C6;              /* 10.2:1. Words in a list or card: the address, the Also titles */
    --ink-3: #9A9CA2;              /* 6.7:1. Resting marks, the grey line, card controls */
    --ink-4: #818389;              /* 4.9:1. Labels ("Also") */
    --hairline: #26272B;           /* rules between rows */
    --hairline-strong: #3E3F44;    /* card borders, the flag ring, underlines */
    --focus: var(--ink);           /* the keyboard ring */
    --shadow-card: 0 14px 32px -16px rgba(0, 0, 0, .7);   /* the one shadow: under a raised card */

    /* Type. Two families; one weight change (the name is light). */
    --font-sans: "Switzer", "Noto Sans Georgian", system-ui, sans-serif;   /* everything */
    --font-ka: "Noto Sans Georgian", sans-serif;   /* the Georgian name */
    --weight-regular: 400;         /* everything but the name */
    --weight-light: 300;           /* the name only */
    --text-body: 1rem;             /* body */
    --leading-body: 1.45;          /* running text */
    --text-small: .875rem;         /* small: Also; label: "Also" in ink-4 */
    --text-card: .875rem;          /* EmailCard and Tooltip text */
    --leading-card: 1.45;          /* EmailCard and Tooltip text. No Georgian value: a card's text is Latin on both pages (the handle, the address), so a card is the same size on / and /ka/ */
    --text-line: 1.0625rem;        /* line: the one sentence under the name */
    --leading-line: 1.45;          /* the line */
    --tracking-line: -.006em;      /* the line, a hair tight */
    --font-name: var(--font-sans); /* the name's family: Switzer, or Noto Sans Georgian on /ka/ */
    --text-name: clamp(2.125rem, 10.8vw, 2.75rem);   /* name: the one large thing */
    --leading-name: 1.04;          /* the name, set solid */
    --tracking-name: -.03em;       /* the name, tight */
    --underline-offset: .3em;      /* an underlined link's line sits this far under the text */

    /* Space. A closed set on a 2 px grid, named by size in px (as GitHub's Primer does). Use only these. */
    --space-2: 2px;
    --space-4: 4px;
    --space-6: 6px;
    --space-8: 8px;
    --space-10: 10px;
    --space-12: 12px;
    --space-14: 14px;
    --space-16: 16px;
    --space-18: 18px;
    --space-20: 20px;
    --space-24: 24px;
    --space-28: 28px;
    --space-32: 32px;
    --space-36: 36px;
    --space-40: 40px;
    --space-48: 48px;
    --space-56: 56px;
    --space-72: 72px;
    --space-88: 88px;

    /* Layout and rhythm: the stage, then the slide's gaps from top to bottom. */
    --gutter: var(--space-16);     /* the stage's side padding */
    --stage-floor: calc(var(--space-32) + env(safe-area-inset-bottom));   /* under Also */
    --measure: 34rem;              /* the slide and Also */
    --measure-slide: var(--measure);   /* the slide alone; wider on a desktop */
    --measure-line: 24em;          /* the line wraps before this */
    --slide-pad-top: var(--space-56); /* above the portrait */
    --slide-pad-bottom: var(--space-8); /* under the marks */
    --key-top: 0px;                /* the flag link's corner, from the top ... */
    --key-right: var(--space-4);    /* ... and from the right */
    --pic-w: clamp(124px, 37vw, 144px);   /* the portrait (keep the <img sizes> in step) */
    --gap-pic-name: var(--space-18); /* portrait to name */
    --gap-name-line: var(--space-8); /* name to line */
    --gap-line-icons: var(--space-28); /* line to marks */
    --gap-icons: var(--space-6);   /* between marks */
    --gap-slide-also: var(--space-40); /* slide to Also (phone) */
    --card-offset: var(--space-8);   /* from the row to a card under it */

    /* Lines, rings, corners. */
    --hairline-w: 1px;             /* every rule, border and ring */
    --focus-w: 2px;                /* the keyboard ring's weight */
    --focus-offset: 3px;           /* its gap from the thing (0 on an icon, -4px inside a card) */
    --radius-hair: 2px;            /* the flag, the notch's tip */
    --radius-focus: 3px;           /* the default focus ring */
    --radius-control: 10px;        /* a control inside a card (copy) */
    --radius-icon: 12px;           /* an icon link's focus ring */
    --radius-card: 14px;           /* EmailCard, Tooltip */
    --notch: 10px;                 /* the card's pointer, a rotated square */
    --notch-inset: 18px;           /* the notch keeps this far from the card's ends */

    /* Icons and targets. */
    --icon: 22px;                  /* a profile mark */
    --icon-target: 48px;           /* its square tap target */
    --icon-sm: 18px;               /* a mark inside a card (copy, tick) */
    --tap: 44px;                   /* the smallest target anywhere */
    --flag-w: 20px;                /* both flags: one 4:3 frame (flag-icons' own shape) ... */
    --flag-h: calc(var(--flag-w) * .75); /* ... 20 x 15 px */
    --flag-rest: .88;              /* the flag's opacity at rest */

    /* Motion (MOTION.md). The page script reads these too, so CSS and JS keep one set of numbers. Only opacity and
       transform move; distances are tiny; nothing loops. */
    --ease-out: cubic-bezier(.22, 1, .36, 1);   /* things arriving */
    --ease-in: cubic-bezier(.4, 0, 1, 1);       /* things leaving */
    --dur-hover: .22s;             /* colour on hover and focus (CSS) */
    --dur-enter: .56s;             /* entrance, per block */
    --dur-enter-pic: .7s;          /* the portrait comes up first, like a stage light */
    --delay-pic: .04s;             /* before the portrait */
    --delay-enter: .12s;           /* the words start after the portrait */
    --stagger: .045s;              /* between entrance blocks */
    --rise-enter: 6px;             /* entrance: blocks rise this far */
    --scale-pic-from: 1.012;       /* the portrait settles from this scale */
    --dur-open: .22s;              /* a card opening */
    --rise-open: 4px;              /* a card drops this far into place */
    --dur-close: .14s;             /* a card closing */
    --rise-close: 2px;             /* and lifts this far on its way out */
    --dur-in: .26s;                /* a label or mark swapping in (copy to tick) */
    --dur-out: .18s;               /* ... and out */
    --delay-in: .06s;              /* the tick starts after the copy mark leaves */
    --rise-swap: 4px;              /* copy and tick move this far */
    --hold-copied: 1.6s;           /* how long the tick stays */
    --dur-press: .18s;             /* press down: a firm spring, no bounce */
    --scale-press: .9;             /* an icon or the copy mark */
    --scale-press-flag: .985;      /* the flag link */
    --dur-settle: .45s;            /* release: a spring with a hint of bounce */
    --bounce-settle: .15;          /* the hint of bounce */
    --delay-tip: .3s;              /* Tooltip: a hover waits this long, so running the pointer along the row flashes nothing */
    --gate-failsafe: 1.2s;         /* the head script shows the page by then whatever happens (it runs before CSS, so it keeps its own copy; the build checks they match) */

    /* Layers. */
    --z-key: 1;                    /* the flag link */
    --z-card: 2;                   /* EmailCard, Tooltip (the card comes later in the page, so it covers a tip) */

    color-scheme: dark;
  }
  /* Georgian: its own sizes, leading and no tracking (Noto Sans Georgian is wider, taller and has no capitals).
     Never uppercase, never letter-spaced. The root selector outranks the breakpoints' plain :root, so a Georgian value
     holds until a Georgian breakpoint changes it; [lang="ka"] alone lets a Georgian block inside an English page (the
     style guide) take the same values. */
  :root[lang="ka"], [lang="ka"] {
    --leading-body: 1.55;
    --font-name: var(--font-ka);
    --text-name: clamp(1.625rem, 8vw, 2.125rem);
    --leading-name: 1.28;
    --tracking-name: 0;
    --text-line: .9375rem;
    --leading-line: 1.55;
    --tracking-line: 0;
    --measure-line: 32em;          /* Georgian words run longer: the line keeps to one line from 600 px */
    --gap-name-line: var(--space-6);
  }
  @media (min-width: 600px) {
    :root {
      --gutter: var(--space-32);
      --stage-floor: var(--space-40);
      --slide-pad-top: var(--space-88);
      --slide-pad-bottom: var(--space-24);
      --key-top: var(--space-12);
      --key-right: var(--space-20);
      --pic-w: 168px;
      --gap-pic-name: var(--space-28);
      --gap-name-line: var(--space-10);
      --gap-line-icons: var(--space-36);
      --gap-icons: var(--space-10);
      --icon-target: 52px;
      --icon: 24px;
      --text-name: 3.5rem;
      --text-line: 1.1875rem;
      --text-card: .9375rem;
    }
    :root[lang="ka"], [lang="ka"] {
      --text-name: 2.625rem;
      --text-line: 1.0625rem;
    }
  }
  /* Sizes and gaps follow the screen's height as well as its width, so the whole slide stays on the first screen from
     a 1280 x 720 laptop to a 1920 x 1080 monitor. */
  @media (min-width: 1000px) {
    :root {
      --gutter: var(--space-48);
      --stage-floor: var(--space-18);   /* 30 px to the floor line's text, as the 44 px links keep 12 px under it */
      --measure-slide: 60rem;
      --slide-pad-top: clamp(var(--space-40), 7vh, var(--space-72));
      --slide-pad-bottom: clamp(var(--space-28), 5vh, var(--space-56));
      --key-top: var(--space-20);
      --key-right: var(--space-36);
      --pic-w: clamp(156px, 23vh, 240px);
      --gap-pic-name: clamp(22px, 3.6vh, var(--space-36));
      --gap-name-line: var(--space-14);
      --gap-line-icons: clamp(var(--space-32), 6vh, var(--space-56));
      --gap-icons: var(--space-16);
      --icon-target: 56px;
      --icon: 26px;
      --text-name: clamp(4rem, min(5.8vw, 9.6vh), 5.75rem);
      --leading-name: 1;
      --tracking-name: -.036em;
      --text-line: 1.375rem;
    }
    :root[lang="ka"], [lang="ka"] {
      --text-name: clamp(2.875rem, min(4.2vw, 7vh), 4.125rem);
      --leading-name: 1.2;
      --text-line: 1.1875rem;
      --gap-name-line: var(--space-10);
    }
  }
  /* Day, kept for later: the same stage with the house lights up. A cool studio grey, the light print of the same
     sitting, whose edges are the page tone and whose pool around the head is a few levels lighter; ink-black type. */
  :root[data-theme="light"] {
    --bg: #E8E9EB;
    --surface: #F3F4F5;
    --ink: #111214;
    --ink-2: #3A3D42;
    --ink-3: #4E5157;
    --ink-4: #5F6268;
    --hairline: #CDCED2;
    --hairline-strong: #A9ABB0;
    color-scheme: light;
  }
  /* ==== END TOKENS ================================================================================================== */

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: var(--weight-regular) var(--text-body)/var(--leading-body) var(--font-sans);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-wrap: break-word;
    font-feature-settings: "kern" 1;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
  :focus-visible { outline: var(--focus-w) solid var(--focus); outline-offset: var(--focus-offset); border-radius: var(--radius-focus); }
  .nw { white-space: nowrap; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  .m-pre [data-enter] { opacity: 0; }

  /* The stage: one centre axis. */
  .stage {
    position: relative; min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column;
    padding: 0 var(--gutter) var(--stage-floor);
  }
  /* The slide sits in the middle of the first screen, "Also" on the floor under it. */
  .slide { width: 100%; max-width: var(--measure-slide); margin: auto; padding: var(--slide-pad-top) 0 var(--slide-pad-bottom); }

  /* FlagLink. The language key: a small flag in the top corner, outside the composition, linking to the other
     language's page (6 Oct: a flag, not a word; 7 Oct: a real link to /ka/ and back). */
  .top { position: absolute; top: var(--key-top); right: var(--key-right); z-index: var(--z-key); }
  /* The target is one hairline taller than --tap (45 px), so the 15 px flag centres on whole pixels: in a 44 px box it
     sat at 14.5 px and its top and bottom edges blurred on a 1x screen. */
  .lang {
    display: inline-flex; align-items: center; min-height: calc(var(--tap) + var(--hairline-w)); min-width: var(--tap); padding: 0 var(--space-12);
  }
  /* Both flags are one component (7 Oct, his ask: "Georgian emoji and USA emoji look different, please use the same
     components"): both are drawn by one open set, lipis/flag-icons 7.5.0 (MIT, vendor/flag-icons/), in its 4:3 frame,
     and here they get the same 20 x 15 box, the same corner, the same hairline ring (which also keeps the white of
     both flags on the light page), the same resting opacity and the same place. */
  .lang .flag { display: block; width: var(--flag-w); height: var(--flag-h); overflow: hidden; border-radius: var(--radius-hair); box-shadow: 0 0 0 var(--hairline-w) var(--hairline-strong); opacity: var(--flag-rest); transition: opacity var(--dur-hover) var(--ease-out); }
  @media (hover: hover) { .lang:hover .flag { opacity: 1; } }

  /* Portrait: a hard-edged 4:5 print on the centre axis. No frame, no shadow: the backdrop's edges are the
     page's own tone, so only the sweater's cut at the bottom draws an edge, and the pool of light around his head is
     in the photograph. */
  .pic { margin: 0 auto; width: var(--pic-w); aspect-ratio: 4 / 5; background: var(--bg); }
  .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* Name: the one large thing, light, tight. Only the name is full white. Line: one grey sentence. */
  .name {
    margin: var(--gap-pic-name) 0 0; text-align: center; font-family: var(--font-name);
    font-weight: var(--weight-light); font-size: var(--text-name); line-height: var(--leading-name); letter-spacing: var(--tracking-name);
  }
  .line {
    margin: var(--gap-name-line) auto 0; max-width: var(--measure-line); text-align: center; color: var(--ink-3);
    font-size: var(--text-line); line-height: var(--leading-line); letter-spacing: var(--tracking-line); text-wrap: balance;
  }

  /* IconLink. The profiles and email: one row of monochrome marks (7 Oct, his ask: "icons instead of LinkedIn ...
     black and white type icons"), in the order he named them: LinkedIn, Facebook, X, Product Hunt, then email. The
     four brand marks are Simple Icons (CC0), the envelope is drawn for the page, filled like them. They rest in the
     muted grey and come up to full ink under the pointer and on focus; never a brand colour, no circles, no pills.
     Each target is a square (48 px on a phone, the glyph 22 px), so a thumb has room between them. */
  .icons { list-style: none; margin: var(--gap-line-icons) 0 0; padding: 0; display: flex; justify-content: center; gap: var(--gap-icons); }
  .ico {
    display: grid; place-items: center; width: var(--icon-target); height: var(--icon-target); border-radius: var(--radius-icon);
    color: var(--ink-3); transition: color var(--dur-hover) var(--ease-out); -webkit-tap-highlight-color: transparent;
  }
  .ico svg { display: block; width: var(--icon); height: var(--icon); }
  @media (hover: hover) { .ico:hover { color: var(--ink); } }
  .ico:focus-visible { color: var(--ink); outline-offset: 0; border-radius: var(--radius-icon); }

  /* EmailCard (7 Oct, his ask: "a copy icon, not a copy button ... we have an email [icon], we don't need [the address
     line] anymore"). The envelope in the row is the one way in. Without JS it is a plain mailto link. With JS a tap
     opens a small quiet card just under the row, on the centre axis: the address (plain text, a long press selects all
     of it), a copy mark (two overlapping sheets, drawn in stroke at the weight of the row's marks; it turns into a
     tick for a moment after a tap) and "Open mail", the mailto. Not a modal: no overlay, nothing behind it dims, the
     page does not move. It closes on Escape, on a tap anywhere else, and on a second tap of the envelope.
     The card floats (absolute, under the row) so opening it shifts nothing. On a phone the address and the copy mark
     share the first line and "Open mail" takes the second, under a hairline; from 600 px it is one line. */
  .reach { position: relative; }
  .pop {
    position: absolute; z-index: var(--z-card); top: calc(100% + var(--card-offset)); left: 0; right: 0; margin: 0 auto;
    width: max-content; max-width: 100%;
    display: grid; grid-template-columns: auto auto; align-items: center; justify-content: center;
    padding: 0; border: var(--hairline-w) solid var(--hairline-strong); border-radius: var(--radius-card);
    background: var(--surface); color: var(--ink-3); font-size: var(--text-card); line-height: var(--leading-card);
    box-shadow: var(--shadow-card);

       address is left selected so it can be copied by hand. The copy mark turns into a tick for --hold-copied (1.6 s),
       its state is data-state="copied" meanwhile, and the live region says so. */
    var ADDR = 'contact@demetremildiani.com', btn = $('#copy'), A = btn.querySelector('.cp-a'), B = btn.querySelector('.cp-b'),
        status = $('#copied'), hold, busy = false;
    function swap(out, inn) {
      to(out, { opacity: 0, transform: rise('--rise-swap', -1) }, { duration: num('--dur-out'), ease: EASE_IN });
      to(inn, { opacity: [0, 1], transform: [rise('--rise-swap'), 'translateY(0px)'] }, { duration: num('--dur-in'), ease: EASE_OUT, delay: num('--delay-in') });
    }
    function done() {
      if (btn.getAttribute('data-state') !== 'copied') swap(A, B);
      btn.setAttribute('data-state', 'copied'); status.textContent = COPIED;
      clearTimeout(hold);
      hold = setTimeout(function () { swap(B, A); btn.removeAttribute('data-state'); status.textContent = ''; }, num('--hold-copied') * 1000);
    }
    function fallback() {
      /* The hidden textarea takes focus for a moment; "busy" keeps that from closing the card, and focus goes back. */
      var ok = false, ta = document.createElement('textarea'), was = document.activeElement;
      ta.value = ADDR; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '-200px'; ta.style.opacity = '0';
      busy = true; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); busy = false;
      if (was && was.focus) try { was.focus({ preventScroll: true }); } catch (e) {}
      if (ok) { done(); return; }
      try { var r = document.createRange(); r.selectNodeContents($('#mail')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
    }
    btn.addEventListener('click', function () {
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(ADDR).then(done, fallback);
      else fallback();
    });

    /* The email card. In the HTML the envelope is a plain mailto link (the page without JS); here it becomes the card's
       switch, a button to assistive tech, with aria-expanded and aria-controls. Opening moves focus to the copy mark;
       closing gives it back to the envelope when it was inside the card. It closes on Escape, on a click or tap outside
       it, on a second tap of the envelope, and when focus leaves it for somewhere else on the page. */
    var ico = $('#mail-ico'), pop = $('#mail-pop'), tok = 0;
    ico.setAttribute('role', 'button'); ico.setAttribute('aria-expanded', 'false'); ico.setAttribute('aria-controls', 'mail-pop');
    function isOpen() { return ico.getAttribute('aria-expanded') === 'true'; }
    function notch() {
      var i = ico.getBoundingClientRect(), p = pop.getBoundingClientRect();
      var k = num('--notch-inset');
      pop.style.setProperty('--cx', Math.max(k, Math.min(p.width - k, i.left + i.width / 2 - p.left)) + 'px');
    }
    function show() {
      tok++; pop.hidden = false; ico.setAttribute('aria-expanded', 'true'); notch();
      to(pop, { opacity: [0, 1], transform: [rise('--rise-open', -1), 'translateY(0px)'] }, { duration: num('--dur-open'), ease: EASE_OUT });
      try { btn.focus({ preventScroll: true }); } catch (e) { btn.focus(); }
    }
    function hide() {
      if (!isOpen()) return;
      var t = ++tok;
      ico.setAttribute('aria-expanded', 'false');
      if (pop.contains(document.activeElement)) try { ico.focus({ preventScroll: true }); } catch (e) { ico.focus(); }
      to(pop, { opacity: 0, transform: rise('--rise-close', -1) }, { duration: num('--dur-close'), ease: EASE_IN })
        .then(function () { if (t === tok) pop.hidden = true; });
    }
    ico.addEventListener('click', function (e) { e.preventDefault(); if (isOpen()) hide(); else show(); });
    ico.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); ico.click(); } });
    /* Escape closes the card if it is open, and otherwise hides any tooltip showing (WCAG 1.4.13: dismissible
       without moving the pointer or focus). A dismissed tip stays hidden until the pointer leaves its mark or focus
       moves on. */
    var hosts = all('.tip-host');
    function hush(h) { h.setAttribute('data-state', 'dismissed'); }
    function wake() { this.removeAttribute('data-state'); }
    /* Keep a tip on screen: centred under its mark unless that takes it closer than --gutter to the window's edge;
       then it slides in by --tip-dx and --cx keeps the notch over the mark (no nearer the tip's ends than
       --notch-inset). Measured just before it can show (pointer in, focus in) and on resize. */
    function place(h) {
      var t = h.querySelector('.tip'); if (!t) return;
      var r = h.getBoundingClientRect(), w = t.offsetWidth, vw = root.clientWidth, g = num('--gutter'), k = num('--notch-inset');
      var c = r.left + r.width / 2, x = c - w / 2, lo = g, hi = vw - g - w;
      var dx = (hi < lo ? lo : Math.max(lo, Math.min(hi, x))) - x;
      t.style.setProperty('--tip-dx', dx + 'px');
      t.style.setProperty('--cx', Math.max(k, Math.min(w - k, w / 2 - dx)) + 'px');
    }
    function placeAll() { hosts.forEach(place); }
    hosts.forEach(function (h) {
      h.addEventListener('mouseleave', wake); h.addEventListener('focusout', wake);
      h.addEventListener('pointerenter', function () { place(h); }); h.addEventListener('focusin', function () { place(h); });
    });
    placeAll(); window.addEventListener('resize', placeAll);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeAll);
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape' && e.key !== 'Esc') return;
      if (isOpen()) { hide(); return; }
      hosts.forEach(function (h) { if (h.matches(':hover') || h.contains(document.activeElement)) hush(h); });
    });
    window.addEventListener('resize', function () { if (isOpen()) notch(); });
    document.addEventListener('click', function (e) { if (isOpen() && !pop.contains(e.target) && !ico.contains(e.target)) hide(); });
    pop.addEventListener('focusout', function (e) {
      var n = e.relatedTarget;
      if (!busy && n && !pop.contains(n) && n !== ico) hide();
    });
  })();
</script>
</body>
</html>
