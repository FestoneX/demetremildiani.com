<script>
  /* Before first paint.
     Theme: always dark, whatever the system asks (7 Oct, his call: "keep the dark theme the default and hide the mode
     switch"). The day theme is kept for later, reachable only by "#light" in the address; there is no visible switch.
     Language: each page is one language (/ English, /ka/ Georgian). Old links with "?lang=ka" go to /ka/ and
     "?lang=en" to /; any other query and the hash ride along. The old "last choice" key is cleared.
     Motion gate (MOTION.md, pattern 0): only when JS runs and motion is allowed are the entrance blocks hidden, and a
     failsafe shows them after 1.2 s whatever happens. Once the failsafe has shown them, the entrance never runs: the
     page script checks the gate is still up before it animates anything. */
  (function () {
    var d = document.documentElement; d.classList.add('js');
    function theme() { if (location.hash === '#light') d.setAttribute('data-theme', 'light'); else d.removeAttribute('data-theme'); }
    theme(); window.addEventListener('hashchange', theme);
    var m = /[?&]lang=(ka|en)\b/.exec(location.search);
    if (m) {
      var to = m[1] === 'ka' ? '/ka/' : '/', q = location.search.replace(/([?&])lang=(ka|en)\b&?/, '$1').replace(/[?&]$/, '');
      if (location.pathname !== to) { location.replace(to + q + location.hash); return; }
      try { history.replaceState(null, '', to + q + location.hash); } catch (e) {}
    }
    try { localStorage.removeItem('lang'); } catch (e) {}
    try { if (!matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('m-pre'); } catch (e) {}
    setTimeout(function () { d.classList.remove('m-pre'); }, 1200);
  })();
</script>

<style>
  /* Design read: a keynote slide at night. One lit portrait on a dark stage, the name set large and light under it,
     one grey line, and under that one quiet row of monochrome marks for the profiles and email. Everything sits on
     one centre axis; the rest is black.
     The light is the photograph's own: each print's backdrop is repainted so its edges meet the page at the page's
     own tone (n4-keynote/photo/prints.py), so the print has no visible frame and the soft pool of light around his
     head, which is the seamless's photographed falloff, is the only glow on the page.
     Type: Hanken Grotesk, light (300) at size; Noto Sans Georgian carries the Georgian.
     Theme: dark always, whatever the system asks (7 Oct). The day palette is kept for later; only "#light" in the
     address turns it on, and nothing on the page links there. */
  :root {
    --bg: #131416;          /* = the dark print's edge tone: the print melts into the stage on three sides */
    --fg: #F2F2F4;          /* 16.5:1 */
    --fg-2: #9A9CA2;        /* 6.7:1 */
    --fg-3: #818389;        /* 4.9:1 */
    --rule: #26272B;
    --rule-hi: #3E3F44;
    --fg-row: #BFC1C6;      /* a step below white: 10.2:1 */
    --raise: #1B1C1F;       /* the email card, one step off the stage */
    --ease: cubic-bezier(.22, 1, .36, 1);
    color-scheme: dark;
  }
  /* Day, kept for later: the same stage with the house lights up. A cool studio grey, the light print of the same
     sitting, whose edges are the page tone and whose pool around the head is a few levels lighter; ink-black type. */
  :root[data-theme="light"] {
    --bg: #E8E9EB; --fg: #111214; --fg-2: #4E5157; --fg-3: #5F6268; --rule: #CDCED2; --rule-hi: #A9ABB0;
    --fg-row: #3A3D42; --raise: #F3F4F5;
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 400 1rem/1.45 "Hanken Grotesk", "Noto Sans Georgian", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-wrap: break-word;
    font-feature-settings: "kern" 1;
  }
  :root[lang="ka"] body { line-height: 1.55; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; border-radius: 3px; }
  .nw { white-space: nowrap; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  .m-pre [data-enter] { opacity: 0; }

  /* The stage: one centre axis. */
  .stage {
    position: relative; min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column;
    padding: 0 16px calc(32px + env(safe-area-inset-bottom));
  }
  /* The slide sits in the middle of the first screen, "Also" on the floor under it. */
  .slide { width: 100%; max-width: 34rem; margin: auto; padding: 56px 0 8px; }

  /* The language key: a small flag in the top corner, outside the composition, linking to the other language's
     page (6 Oct: a flag, not a word; 7 Oct: a real link to /ka/ and back). */
  .top { position: absolute; top: 0; right: 4px; z-index: 1; }
  .lang {
    display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; padding: 0 12px;
    font-size: .875rem; color: var(--fg-2); transition: color .22s var(--ease);
  }
  /* A hairline ring keeps the white of both flags on the light page. */
  .lang .flag { display: block; height: 15px; width: auto; border-radius: 2px; box-shadow: 0 0 0 1px var(--rule-hi); opacity: .88; transition: opacity .22s var(--ease); }
  @media (hover: hover) { .lang:hover .flag { opacity: 1; } }

  /* The portrait: a hard-edged 4:5 print on the centre axis. No frame, no shadow: the backdrop's edges are the
     page's own tone, so only the sweater's cut at the bottom draws an edge, and the pool of light around his head is
     in the photograph. */
  .pic { margin: 0 auto; width: clamp(124px, 37vw, 144px); aspect-ratio: 4 / 5; background: var(--bg); }
  .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* The one large thing: the name, light, tight. Only the name is full white. */
  .name {
    margin: 18px 0 0; text-align: center;
    font-weight: 300; font-size: clamp(2.125rem, 10.8vw, 2.75rem); line-height: 1.04; letter-spacing: -.034em;
  }
  :root[lang="ka"] .name { font-family: "Noto Sans Georgian", sans-serif; font-size: clamp(1.625rem, 8vw, 2.125rem); line-height: 1.28; letter-spacing: 0; }
  .line { margin: 8px auto 0; max-width: 24em; text-align: center; color: var(--fg-2); font-size: 1.0625rem; letter-spacing: -.004em; text-wrap: balance; }
  :root[lang="ka"] .line { margin-top: 6px; font-size: .9375rem; line-height: 1.55; letter-spacing: 0; }

  /* The profiles and email: one row of monochrome marks (7 Oct, his ask: "icons instead of LinkedIn ... black and
     white type icons"), in the order he named them: LinkedIn, Facebook, X, Product Hunt, then email. The four brand
     marks are Simple Icons (CC0), the envelope is drawn for the page, filled like them. They rest in
     the muted grey and come up to full ink under the pointer and on focus; never a brand colour, no circles, no
     pills. Each target is 48 px square on a phone (the glyph 22 px), so a thumb has room between them. */
  .icons { list-style: none; margin: 28px 0 0; padding: 0; display: flex; justify-content: center; gap: 6px; }
  .ico {
    display: grid; place-items: center; width: 48px; height: 48px; border-radius: 12px;
    color: var(--fg-2); transition: color .22s var(--ease); -webkit-tap-highlight-color: transparent;
  }
  .ico svg { display: block; width: 22px; height: 22px; }
  @media (hover: hover) { .ico:hover { color: var(--fg); } }
  .ico:focus-visible { color: var(--fg); outline-offset: 0; border-radius: 12px; }

  /* The email (7 Oct, his ask: "a copy icon, not a copy button ... we have an email [icon], we don't need [the address
     line] anymore"). The envelope in the row is the one way in. Without JS it is a plain mailto link. With JS a tap
     opens a small quiet card just under the row, on the centre axis: the address (plain text, a long press selects all
     of it), a copy mark (two overlapping sheets, drawn in stroke at the weight of the row's marks; it turns into a
     tick for a moment after a tap) and "Open mail", the mailto. Not a modal: no overlay, nothing behind it dims, the
     page does not move. It closes on Escape, on a tap anywhere else, and on a second tap of the envelope.
     The card floats (absolute, under the row) so opening it shifts nothing. On a phone the address and the copy mark
     share the first line and "Open mail" takes the second, under a hairline; from 600 px it is one line. */
  .reach { position: relative; }
  .pop {
    position: absolute; z-index: 2; top: calc(100% + 8px); left: 0; right: 0; margin: 0 auto;
    width: max-content; max-width: 100%;
    display: grid; grid-template-columns: auto auto; align-items: center; justify-content: center;
    padding: 0; border: 1px solid var(--rule-hi); border-radius: 14px;
    background: var(--raise); color: var(--fg-2); font-size: .875rem;
    box-shadow: 0 14px 32px -16px rgba(0, 0, 0, .7);
  }
  .pop[hidden] { display: none; }
  /* A small notch on the card's top edge points at the envelope (the script sets --cx to the envelope's centre), and
     the envelope stays at full ink while its card is open: that is what ties the two together. */
  .pop::before {
    content: ""; position: absolute; top: -6px; left: var(--cx, 50%); width: 10px; height: 10px; margin-left: -5px;
    background: var(--raise); border: solid var(--rule-hi); border-width: 1px 0 0 1px; border-top-left-radius: 2px;
    transform: rotate(45deg);
  }
  .ico[aria-expanded="true"] { color: var(--fg); }
  .pop .mail { color: var(--fg-row); -webkit-user-select: all; user-select: all; overflow-wrap: anywhere; padding: 12px 0 12px 16px; }
  .pop .copy {
    display: inline-grid; place-items: center; width: 44px; height: 44px; margin-right: 2px; border-radius: 10px;
    color: var(--fg-2); transition: color .22s var(--ease); -webkit-tap-highlight-color: transparent;
  }
  .pop .copy > span { grid-area: 1 / 1; display: block; }
  .pop .copy svg { display: block; width: 18px; height: 18px; }
  .cp-b { opacity: 0; }
  .pop .copy.on { color: var(--fg); }
  .pop .open {
    grid-column: 1 / -1; justify-self: stretch; display: flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 0 16px; border-top: 1px solid var(--rule);
    color: var(--fg-2); transition: color .22s var(--ease); white-space: nowrap;
  }
  .pop .open span { text-decoration: underline; text-decoration-color: var(--rule-hi); text-decoration-thickness: 1px; text-underline-offset: .3em; transition: text-decoration-color .22s var(--ease); }
  @media (hover: hover) {
    .pop .copy:hover, .pop .open:hover { color: var(--fg); }
    .pop .open:hover span { text-decoration-color: currentColor; }
  }
  .pop .copy:focus-visible { outline-offset: -4px; border-radius: 10px; }
  .pop .open:focus-visible { outline-offset: -4px; }

  /* Also: after the slide, small and grey. */
  .also { width: 100%; max-width: 34rem; margin: 40px auto 0; font-size: .875rem; }
  .also h2 { margin: 0 0 4px; font: inherit; color: var(--fg-3); }
  .also ul { list-style: none; margin: 0; padding: 0; }
  .also a { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 12px; align-items: baseline; min-height: 44px; padding: 11px 0; border-top: 1px solid var(--rule); }
  .also .t { color: var(--fg-row); }
  .also .w { color: var(--fg-2); }
  @media (hover: hover) { .also a:hover .t { color: var(--fg); } }

  @media (min-width: 600px) {
    .stage { padding: 0 32px 40px; }
    .top { right: 20px; top: 12px; }
    .slide { padding: 88px 0 24px; }
    .pic { width: 168px; }
    .name { font-size: 3.5rem; margin-top: 28px; }
    :root[lang="ka"] .name { font-size: 2.625rem; }
    .line { font-size: 1.1875rem; margin-top: 10px; }
    :root[lang="ka"] .line { font-size: 1.0625rem; }
    .icons { margin-top: 36px; gap: 10px; }
    .ico { width: 52px; height: 52px; }
    .ico svg { width: 24px; height: 24px; }
    .pop { grid-template-columns: auto auto auto; font-size: .9375rem; }
    /* One line: "Open mail" after the copy mark, a short hairline between them; still 44 px tall to the finger. */
    .pop .open { grid-column: auto; border-top: 0; padding: 0 18px 0 16px; background: linear-gradient(var(--rule-hi), var(--rule-hi)) left center / 1px 18px no-repeat; }
  }

  /* Desktop: the first screen is the slide, centred on both axes; the marks and the address close it on the centre
     axis; "Also" is a quiet line on the stage floor. */
  @media (min-width: 1000px) {
    .stage { padding: 0 48px 18px; }   /* 30 px to the floor line's text, as the 44 px links keep 12 px under it */
    /* Sizes and gaps follow the screen's height as well as its width, so the whole slide, address included, stays on
       the first screen from a 1280 x 720 laptop to a 1920 x 1080 monitor. */
    .slide { max-width: 60rem; margin: auto; padding: clamp(40px, 7vh, 72px) 0 clamp(28px, 5vh, 56px); }
    .top { right: 36px; top: 20px; }
    .pic { width: clamp(156px, 23vh, 240px); margin-top: 0; }
    .name { font-size: clamp(4rem, min(5.8vw, 9.6vh), 5.75rem); margin-top: clamp(22px, 3.6vh, 36px); letter-spacing: -.038em; line-height: 1; }
    :root[lang="ka"] .name { font-size: clamp(2.875rem, min(4.2vw, 7vh), 4.125rem); line-height: 1.2; }
    .line { font-size: 1.375rem; margin-top: 14px; }
    :root[lang="ka"] .line { font-size: 1.1875rem; margin-top: 10px; }
    .icons { margin-top: clamp(32px, 6vh, 56px); gap: 16px; }
    .ico { width: 56px; height: 56px; }
    .ico svg { width: 26px; height: 26px; }
    .also { max-width: none; margin: -12px 0 0; display: flex; justify-content: center; align-items: baseline; gap: 4px 28px; flex-wrap: wrap; }
    .also h2 { margin: 0; }
    .also ul { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 28px; }
    /* Still 44 px tall to the finger (an iPad in landscape is a touch screen at desktop width); the text sits on the
       same baseline as before, and the stage's bottom padding gives back the extra height. */
    .also a { display: inline-flex; align-items: center; min-height: 44px; padding: 0; border: 0; }
    .also .t { color: var(--fg-2); transition: color .22s var(--ease); }
    .also .w { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
    .also li { position: relative; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation: none !important; }
  }
</style>

<script>
  (function () {
    var M = window.Motion, root = document.documentElement;
    var RM = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
    function calm() { return !!M && !RM.matches; }
    function syncRM() { if (M && M.MotionGlobalConfig) M.MotionGlobalConfig.skipAnimations = RM.matches; }
    syncRM(); if (RM.addEventListener) RM.addEventListener('change', syncRM);
    var EASE_OUT = [0.22, 1, 0.36, 1], EASE_IN = [0.4, 0, 1, 1];
    var SETTLE = { type: 'spring', duration: 0.45, bounce: 0.15 }, FIRM = { type: 'spring', duration: 0.18, bounce: 0 };
    function jump(els, kf) {
      [].concat(els.length != null && !els.style ? [].slice.call(els) : [els]).forEach(function (el) {
        for (var k in kf) { var v = kf[k]; el.style[k] = Array.isArray(v) ? v[v.length - 1] : v; }
      });
      return Promise.resolve();
    }
    function to(els, kf, opt) { return calm() ? M.animate(els, kf, opt) : jump(els, kf); }

    var $ = function (s) { return document.querySelector(s); };
    var all = function (s) { return [].slice.call(document.querySelectorAll(s)); };
    var COPIED = 'ელფოსტის მისამართი დაკოპირდა';

    /* The photo follows the theme: the dark print always, the light one only under "#light" (its <source> is off by
       default, "media: not all"); the browser bar's colour follows too. */
    var srcL = $('#pic-light'), bar = $('meta[name="theme-color"]');
    function syncPic() {
      var light = root.getAttribute('data-theme') === 'light';
      srcL.setAttribute('media', light ? 'all' : 'not all');
      bar.setAttribute('content', light ? '#E8E9EB' : '#131416');
    }
    syncPic(); window.addEventListener('hashchange', syncPic);

    /* Entrance: the print comes up first, like a stage light; the words follow, a beat apart. Only while the gate is
       still up: on a slow connection the 1.2 s failsafe may already have shown the page, and fading it out to fade it
       back in would be the very flash the gate exists to prevent. */
    function enter() {
      var gated = root.classList.contains('m-pre');
      if (calm() && gated) {
        M.animate('.pic', { opacity: [0, 1], transform: ['scale(1.012)', 'scale(1)'] }, { duration: 0.7, ease: EASE_OUT, delay: 0.04 });
        M.animate(all('.name, .line, .icons li, .top, .also'),
          { opacity: [0, 1], transform: ['translateY(6px)', 'translateY(0px)'] },
          { duration: 0.56, ease: EASE_OUT, delay: M.stagger(0.045, { startDelay: 0.12 }) });
      }
      root.classList.remove('m-pre');
    }
    enter();

    if (M) {
      /* Press: a mark (and the copy mark in the email card) dips to 0.9 (it is small, so it needs the deeper dip to be
         seen), the flag to 0.985, and each springs back. Two guards keep Motion from ever reading the resting
         "transform: none", which it interpolates as scale(0): an inline scale(1) is seeded before the first press,
         and the press keyframes start explicitly at scale(1). Without them a quick tap (released before the press
         animation had drawn a frame) made the release spring start from almost nothing: measured in headless Chrome,
         the key fell to scale 0.07 at 36 ms after a 0 ms tap and to 0.63 after a 40 ms hold, then grew back. With
         them it stays between the dip and 1.0001, and a 0 ms tap does not move at all. */
      M.press('.ico, .copy, .lang', function (el) {
        if (!calm()) return;
        if (!el.style.transform) el.style.transform = 'scale(1)';
        M.animate(el, { transform: ['scale(1)', el.classList.contains('lang') ? 'scale(0.985)' : 'scale(0.9)'] }, FIRM);
        return function () { M.animate(el, { transform: 'scale(1)' }, SETTLE); };
      });
    }

    /* Copy: the clipboard API where it exists, the old execCommand route where it doesn't, and if both fail the
       address is left selected so it can be copied by hand. The copy mark turns into a tick for 1.6 s, and the live
       region says so. */
    var ADDR = 'contact@demetremildiani.com', btn = $('#copy'), A = btn.querySelector('.cp-a'), B = btn.querySelector('.cp-b'),
        status = $('#copied'), hold, busy = false;
    function swap(out, inn) {
      to(out, { opacity: 0, transform: 'translateY(-4px)' }, { duration: 0.18, ease: EASE_IN });
      to(inn, { opacity: [0, 1], transform: ['translateY(4px)', 'translateY(0px)'] }, { duration: 0.26, ease: EASE_OUT, delay: 0.06 });
    }
    function done() {
      if (!btn.classList.contains('on')) swap(A, B);
      btn.classList.add('on'); status.textContent = COPIED;
      clearTimeout(hold);
      hold = setTimeout(function () { swap(B, A); btn.classList.remove('on'); status.textContent = ''; }, 1600);
    }
    function fallback() {
      /* The hidden textarea takes focus for a moment; "busy" keeps that from closing the card, and focus goes back. */
      var ok = false, ta = document.createElement('textarea'), was = document.activeElement;
      ta.value = ADDR; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '-200px'; ta.style.opacity = '0';
      busy = true; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); busy = false;
      if (was && was.focus) try { was.focus({ preventScroll: true }); } catch (e) {}
      if (ok) { done(); return; }
      try { var r = document.createRange(); r.selectNodeContents($('#mail')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
    }
    btn.addEventListener('click', function () {
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(ADDR).then(done, fallback);
      else fallback();
    });

    /* The email card. In the HTML the envelope is a plain mailto link (the page without JS); here it becomes the card's
       switch, a button to assistive tech, with aria-expanded and aria-controls. Opening moves focus to the copy mark;
       closing gives it back to the envelope when it was inside the card. It closes on Escape, on a click or tap outside
       it, on a second tap of the envelope, and when focus leaves it for somewhere else on the page. */
    var ico = $('#mail-ico'), pop = $('#mail-pop'), tok = 0;
    ico.setAttribute('role', 'button'); ico.setAttribute('aria-expanded', 'false'); ico.setAttribute('aria-controls', 'mail-pop');
    function isOpen() { return ico.getAttribute('aria-expanded') === 'true'; }
    function notch() {
      var i = ico.getBoundingClientRect(), p = pop.getBoundingClientRect();
      pop.style.setProperty('--cx', Math.max(18, Math.min(p.width - 18, i.left + i.width / 2 - p.left)) + 'px');
    }
    function show() {
      tok++; pop.hidden = false; ico.setAttribute('aria-expanded', 'true'); notch();
      to(pop, { opacity: [0, 1], transform: ['translateY(-4px)', 'translateY(0px)'] }, { duration: 0.22, ease: EASE_OUT });
      try { btn.focus({ preventScroll: true }); } catch (e) { btn.focus(); }
    }
    function hide() {
      if (!isOpen()) return;
      var t = ++tok;
      ico.setAttribute('aria-expanded', 'false');
      if (pop.contains(document.activeElement)) try { ico.focus({ preventScroll: true }); } catch (e) { ico.focus(); }
      to(pop, { opacity: 0, transform: 'translateY(-2px)' }, { duration: 0.14, ease: EASE_IN })
        .then(function () { if (t === tok) pop.hidden = true; });
    }
    ico.addEventListener('click', function (e) { e.preventDefault(); if (isOpen()) hide(); else show(); });
    ico.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); ico.click(); } });
    document.addEventListener('keydown', function (e) { if ((e.key === 'Escape' || e.key === 'Esc') && isOpen()) hide(); });
    window.addEventListener('resize', function () { if (isOpen()) notch(); });
    document.addEventListener('click', function (e) { if (isOpen() && !pop.contains(e.target) && !ico.contains(e.target)) hide(); });
    pop.addEventListener('focusout', function (e) {
      var n = e.relatedTarget;
      if (!busy && n && !pop.contains(n) && n !== ico) hide();
    });
  })();
